#
# default configuration file for rteval
#
[rteval]
duration:  60.0
report_interval: 600

# Measurement module selection
# Default: timerlat (preferred for modern kernels with SCHED_DEADLINE support)
# Alternative: cyclictest (legacy, SCHED_FIFO based)
[measurement]
timerlat: module
# cyclictest: module

[loads]
kcompile:  module
hackbench: module
stressng:  module
