[rteval]
verbose:   False
keepdata:  True
debugging: False
duration:  60.0
report_interval: 600

# Measurement module selection
# Default: timerlat (preferred for modern kernels with SCHED_DEADLINE support)
# Alternative: cyclictest (legacy, SCHED_FIFO based)
# To change, set one of: timerlat: module OR cyclictest: module
[measurement]
timerlat: module

[cyclictest]
buckets:	3500
interval:	100
distance:	0
priority:	95

[timerlat]
buckets:	3500
interval:	100
priority:	95

[loads]
kcompile:  module
hackbench: module
dbench:    external
stressng: module

[kcompile]
source: linux-6.17.7.tar.xz
jobspercore: 2

[hackbench]
jobspercore: 2

[dbench]
source:  dbench.tar.gz
setup:  tar -xvf dbench.tar.gz
build:  ./configure && make
runload:  dbench -c ./client.txt 10

